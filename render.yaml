services:
  - type: web
    name: anketa-ia
    runtime: python
    buildCommand: ""
    startCommand: "python server.py"
    envVars:
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        value: admin123
      - key: DATA_DIR
        value: /var/data
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1